<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Crash Physics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 20px; left: 20px;
      color: #fff; font-size: 22px; font-weight: bold; z-index: 10;
      pointer-events: none;
    }
    #replayBtn {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px; font-size: 16px;
      background: #e94560; color: white;
      border: none; border-radius: 8px; cursor: pointer; z-index: 10;
    }
    #replayBtn:hover { background: #c73650; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="info">Bricks knocked: <span id="count">0</span></div>
  <button id="replayBtn">Replay</button>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    const GRAVITY = 0.4;
    const GROUND_Y = H - 50;
    let car, bricks, particles, score, stopped;

    function createCar() {
      return { x: 40, y: H - 420, w: 50, h: 25,
        vx: 3.5, vy: 0, alive: true,
        damage: false, crumple: 0 };
    }

    function createBricks() {
      bricks = [];
      const BW = 30, BH = 20;
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 8; c++) {
          bricks.push({
            x: W * 0.6 - 30 + c * (BW + 5),
            y: 80 + r * (BH + 5),
            w: BW, h: BH, vx: 0, vy: 0,
            alive: true
          });
        }
      }
    }

    function createParticles(x, y) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x + Math.random() * BW,
          y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 4 - 2,
          life: 20 + Math.random() * 15,
          size: 2 + Math.random() * 3,
          color: Math.random() > 0.5 ? '#ff6600' : '#ffaa00'
        });
      }
    }

    function knockBricks() {
      let knocked = 0;
      for (let b of bricks) {
        if (!b.alive) continue;
        if (b.y + b.h > H * 0.65) {
          b.alive = false;
          b.vx = (Math.random() - 0.5) * 6;
          b.vy = -(2 + Math.random() * 3);
          knocked++;
          score++;
          document.getElementById('count').textContent = score;
        }
      }
    }

    function updateCar() {
      if (!car.alive || stopped) return;
      car.x += car.vx;
      car.y += car.vy;
      car.vy += GRAVITY;
      if (car.y + car.h >= GROUND_Y) {
        car.y = GROUND_Y - car.h;
        car.vy *= 0.7;
        if (Math.abs(car.vy) < 0.3) car.vy = 0;
      }
      const wallX = W * 0.6 - 30;
      if (car.x + car.w >= wallX && !car.crumple) {
        car.crumple++;
        car.damage = true;
        stopped = true;
        createParticles(car.x + car.w / 2, car.y);
        knockBricks();
      }
    }

    function updateBricks() {
      for (let b of bricks) {
        if (!b.alive) continue;
        b.x += b.vx;
        b.y += b.vy;
        b.vy += GRAVITY;
        if (b.y + b.h >= GROUND_Y) {
          b.y = GROUND_Y - b.h;
          b.vy *= 0.6;
          if (Math.abs(b.vy) < 0.3) b.vy = 0;
        }
        const wallX = W * 0.6 - 30;
        if (b.x + b.w >= wallX) {
          b.x = wallX - b.w;
          b.vx *= -0.5;
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawCar() {
      ctx.fillStyle = car.damage ? '#8b0000' : '#d35400';
      ctx.fillRect(car.x, car.y, car.w, car.h);
      ctx.fillStyle = '#333';
      ctx.fillRect(car.x + 10, car.y + car.h - 6, 8, 6);
      ctx.fillRect(car.x + car.w - 18, car.y + car.h - 6, 8, 6);
      if (car.damage && car.crumple > 0) {
        ctx.fillStyle = '#ff6666';
        ctx.fillRect(car.x + car.w * 0.25, car.y + 5, car.w * 0.35, 8);
      }
    }

    function drawBricks() {
      for (let b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#e74c3c';
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }
    }

    function drawParticles() {
      for (let p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 20);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      ctx.fillStyle = '#4a6572';
      for (let x = 0; x < W; x += 60) {
        ctx.fillRect(x, GROUND_Y + 8, 40, 3);
      }
      drawBricks();
      drawCar();
      drawParticles();
    }

    function loop() {
      updateCar();
      updateBricks();
      updateParticles();
      draw();
      requestAnimationFrame(loop);
    }

    function init() {
      car = createCar();
      createBricks();
      particles = [];
      score = 0;
      stopped = false;
      document.getElementById('count').textContent = score;
      document.getElementById('replayBtn').style.display = 'block';
    }

    init();
    document.getElementById('replayBtn').addEventListener('click', () => { init(); });
    loop();
  </script>
</body>
</html>
