<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Crash Physics Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #444;
            background: #333;
            display: block;
        }
        #controls {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        #counter {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #replayBtn {
            padding: 10px 20px;
            font-size: 18px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #replayBtn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="400"></canvas>
    <div id="controls">
        <div id="counter">Bricks knocked: 0</div>
        <button id="replayBtn">Replay</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
